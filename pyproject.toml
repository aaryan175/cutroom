[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cutroom"
version = "0.1.0"
description = "An AI-operated edit room: index a large clip library, plan edits with Claude Code, render captioned, beat-synced videos with ffmpeg, and review them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "opencv-python-headless>=4.8,<5",   # OpenCV 5 dropped the bundled Haar face cascades
  "opencv-python>=4.8,<5",            # pulled in by scenedetect; keep both builds on the same 4.x
  "librosa>=0.10",
  "soundfile>=0.12",
  "scenedetect>=0.6",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]   # Apple Silicon GPU ASR
voice = ["deepfilternet>=0.5"]
nle = ["opentimelineio>=0.17", "otio-fcp-adapter>=1.0", "otio-fcpx-xml-adapter>=1.0", "otio-cmx3600-adapter>=1.0"]   # .otio + cross-checks
dev = ["pytest>=7"]

[project.scripts]
cutroom = "cutroom.cli:main"

[tool.setuptools.packages.find]
include = ["cutroom*"]

[tool.setuptools.package-data]
cutroom = ["studio_web/**/*", "factory/prompts/*.md", "factory/schemas/*.json"]
